app:
  title: Backstage PoC
  baseUrl: http://localhost:7007

integrations:
  github:
    - host: github.com

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    host: 0.0.0.0
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  reading:
    allow:
      - host: raw.githubusercontent.com

organization:
  name: HF-ITCNE24

permission:
  enabled: false

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  rules:
    - allow:
        - Component
        - System
        - API
        - Resource
        - Location
        - User
        - Group

  locations:
    - type: file
      target: /app/catalog/users.yaml

    - type: file
      target: /app/catalog/groups.yaml

    - type: url
      target: https://raw.githubusercontent.com/Radball-Migi/HF-ITCNE24-SemArbeit3-MSVC-Lizenztool/main/catalog-info.yaml

    - type: url
      target: https://raw.githubusercontent.com/Radball-Migi/HF-ITCNE24-SemArbeit5-DevelopperHub-Inno/main/catalog-info.yaml

    - type: url
      target: https://raw.githubusercontent.com/Radball-Migi/HF-ITCNE24-SemArbeit2-BPMN-Personalprozess/main/catalog-info.yaml

    - type: url
      target: https://raw.githubusercontent.com/Radball-Migi/HF-ITCNE24-SemArbeit4-LicenseMonitor-K8s/main/catalog-info.yaml

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: minikube
          authProvider: serviceAccount
          skipTLSVerify: true